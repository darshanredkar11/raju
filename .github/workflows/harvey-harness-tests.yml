name: Harvey harness tests

on:
  push:
    branches:
      - harvey-native-harness
  pull_request:
    branches:
      - harvey-native-harness

jobs:
  harness-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest PyYAML
      - name: Test harness installers and approval safety
        run: python -m pytest -q tests_harness
